<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Follow Studio</title>
  <desc id="desc">A clearer view of your Instagram following. A Chrome and Brave extension. No coding, no Monkey extension, no store account.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#29233f"/><stop offset="1" stop-color="#101520"/></linearGradient>
    <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#b4a4ff"/><stop offset="1" stop-color="#7865db"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="40" r="240" fill="#a392ff" opacity=".04"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <rect x="50" y="48" width="64" height="64" rx="20" fill="url(#purple)"/>
    <path d="M82 59 L89 77 L106 80 L91 89 L84 105 L76 89 L61 82 L76 76 Z" fill="white"/>
    <text x="134" y="92" fill="#f5f2ff" font-size="38" font-weight="700" letter-spacing="-1">Follow Studio</text>
    <text x="50" y="174" fill="#f5f2ff" font-size="37" font-weight="600" letter-spacing="-.8">A clearer view of your Instagram following.</text>
    <text x="50" y="216" fill="#b1b8cc" font-size="21">Import your export. Review your list. Keep the accounts you care about.</text>
    <rect x="50" y="266" width="190" height="42" rx="21" fill="#a392ff" fill-opacity=".13"/>
    <text x="145" y="293" text-anchor="middle" fill="#cec3ff" font-size="16" font-weight="600">CHROME + BRAVE</text>
    <text x="267" y="293" fill="#b1b8cc" font-size="17">No coding</text>
    <circle cx="387" cy="287" r="3" fill="#666b80"/>
    <text x="410" y="293" fill="#b1b8cc" font-size="17">No Monkey extension</text>
    <circle cx="615" cy="287" r="3" fill="#666b80"/>
    <text x="638" y="293" fill="#b1b8cc" font-size="17">No store account</text>
  </g>
</svg>
